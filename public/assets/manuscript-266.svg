<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 900"><filter id="n"><feTurbulence baseFrequency=".7" numOctaves="4" stitchTiles="stitch"/><feBlend mode="multiply" in2="SourceGraphic"/></filter><rect width="700" height="900" fill="#d8bb7c"/><rect x="32" y="28" width="636" height="844" rx="8" fill="#ead59c" stroke="#815937" stroke-width="3"/><g fill="#54331f" font-family="Georgia" font-size="19" opacity=".86"><text x="70" y="85">In nomine domini nostri...</text><text x="70" y="120">E começou o conto da vida</text><text x="70" y="155">do sancto homem que foy</text><text x="70" y="190">per muitas terras e mares</text><text x="70" y="225">em busca de saber e de paz.</text><text x="70" y="275">¶ E disserom os antigos</text><text x="70" y="310">que toda cousa muda</text><text x="70" y="345">segundo o tempo e o uso.</text><text x="70" y="395">As palavras som memoria</text><text x="70" y="430">daquelles que as disserom.</text><text x="70" y="480">E cada mão que escreve</text><text x="70" y="515">deixa sinal de seu tempo.</text><text x="70" y="565">Non julgueis a voz alheia</text><text x="70" y="600">sem primeiro a conhecer.</text><text x="70" y="650">Ca a lingua he viva</text><text x="70" y="685">e por isso sempre varia.</text><text x="70" y="750">Explicit.</text></g><path d="M50 50h600v800H50z" fill="none" stroke="#9d2d26" stroke-width="7" opacity=".55"/><rect width="700" height="900" filter="url(#n)" opacity=".1"/></svg>
